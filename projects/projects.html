<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Ezra Wingard — Projects
    </title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="/css/global.css"
    >

    <link
        rel="stylesheet"
        href="/css/projects.css"
    >

    <link
        rel="stylesheet"
        href="/css/projects-animation.css"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
        rel="stylesheet"
    >

</head>


<body>

<main class="page">

    <header class="page-header">

        <p class="eyebrow">
            A collection of work
        </p>

        <h1>
            My Projects
        </h1>

        <p class="intro">
            Research, publications, creative projects,
            and other work.
        </p>

    </header>


    <section
        class="library"
        aria-label="Project library"
    >

        <div class="shelf-unit">

            <div
                class="books"
                id="shelf-one"
            ></div>

            <div class="shelf"></div>

        </div>


        <div class="shelf-unit">

            <div
                class="books"
                id="shelf-two"
            ></div>

            <div class="shelf"></div>

        </div>

    </section>

</main>


<!-- =====================================================
     BOOK VIEWER
====================================================== -->

<div
    id="book-viewer"
    class="book-viewer"
    aria-hidden="true"
>

    <div
        id="viewer-backdrop"
        class="viewer-backdrop"
    ></div>


    <!-- =================================================
         CLOSE
    ================================================== -->

    <button
        id="close-book"
        class="close-book"
        type="button"
        aria-label="Close book"
    >
        ×
    </button>


    <!-- =================================================
         BOOK STAGE
    ================================================== -->

    <div class="book-stage">

        <!-- =================================================
             COVER
        ================================================== -->

        <div
            id="book-cover"
            class="book-cover"
            aria-label="Project cover"
        >

            <div class="book-cover-decoration">

                <span class="book-cover-small">
                    COLLECTION
                </span>


                <span
                    id="cover-title"
                    class="book-cover-title"
                ></span>


                <span class="book-cover-line"></span>


                <span class="book-cover-small">
                    2026
                </span>

            </div>

        </div>


        <!-- =================================================
             OPEN BOOK
        ================================================== -->

        <div
            id="open-book-spread"
            class="open-book-spread"
            aria-label="Open project book"
        >

            <!-- Left page -->

            <div
                id="left-page"
                class="book-page book-page-left"
            ></div>


            <!-- Right page -->

            <div
                id="right-page"
                class="book-page book-page-right"
            ></div>


            <!-- Center gutter -->

            <div
                class="book-gutter"
                aria-hidden="true"
            ></div>


            <!-- Animated turning sheet -->

            <div
                id="page-flip-layer"
                class="page-flip-layer"
                aria-hidden="true"
            ></div>

        </div>

    </div>


    <!-- =================================================
         NAVIGATION
    ================================================== -->

    <button
        id="previous-page"
        class="book-nav previous"
        type="button"
        aria-label="Previous page"
    >
        ←
    </button>


    <button
        id="next-page"
        class="book-nav next"
        type="button"
        aria-label="Next page"
    >
        →
    </button>

</div>


<script src="js/projects-content.js"></script>

<script src="js/projects-books.js"></script>

</body>

</html>
