<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ezra Wingard's Portfolio</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css?family=Bebas+Neue&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/global.css"/>
    <link rel="stylesheet" href="/css/projects.css">
    <script src="https://kit.fontawesome.com/ea87ee6546.js" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projects</title>
</head>

<body>

    <main class="page">

        <header class="page-header">
            <p class="eyebrow">A collection of work</p>

            <h1>My Projects</h1>

            <p class="intro">
                Research, publications, creative projects,
                and other work.
            </p>
        </header>


        <!-- =========================================
             BOOKSHELF
        ========================================== -->

        <section class="library">

            <!-- Shelf 1 -->

            <div class="shelf-unit">

                <div
                    class="books"
                    id="shelf-one">
                </div>

                <div class="shelf"></div>

            </div>


            <!-- Shelf 2 -->

            <div class="shelf-unit">

                <div
                    class="books"
                    id="shelf-two">
                </div>

                <div class="shelf"></div>

            </div>

        </section>

    </main>


    <!-- =============================================
         OPEN BOOK
    ============================================== -->
<div id="book-viewer" class="book-viewer">

    <div id="viewer-backdrop" class="viewer-backdrop"></div>

    <button id="close-book" class="close-book">×</button>

    <div id="open-book" class="open-book">

        <!-- BACK COVER -->
        <div class="book-cover book-back-cover"></div>

        <!-- PAGE BLOCK -->
        <div class="book-block">

            <!-- LEFT PAGE -->
            <section class="book-page left-page">

                <div class="page-content">

                    <span class="page-label">
                        Selected Work
                    </span>

                    <h2 id="left-title"></h2>

                    <div id="left-content"></div>

                </div>

                <span class="page-number">
                    1
                </span>

            </section>


            <!-- RIGHT PAGE -->
            <section class="book-page right-page">

                <div class="page-content">

                    <span class="page-label">
                        2026
                    </span>

                    <h2 id="right-title"></h2>

                    <div id="right-content"></div>

                </div>

                <span class="page-number">
                    2
                </span>

            </section>

        </div>


        <!-- FRONT COVER -->
        <div id="book-front-cover" class="book-cover book-front-cover">

            <div class="cover-decoration">

                <span class="cover-small">
                    COLLECTION
                </span>

                <span id="cover-title" class="cover-title"></span>

                <span class="cover-line"></span>

                <span class="cover-small">
                    2026
                </span>

            </div>

        </div>

    </div>

    <button id="previous-page" class="book-nav previous">
        ←
    </button>

    <button id="next-page" class="book-nav next">
        →
    </button>

</div>


    <script src="projects.js"></script>

</body>
</html>
