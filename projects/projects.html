<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Ezra's Projects</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css?family=Bebas+Neue&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/global.css"/>
    <link rel="stylesheet" href="/css/project.css"/>
    <script src="https://kit.fontawesome.com/ea87ee6546.js" crossorigin="anonymous"></script>
</head>
<body>
<div class="excel-window">

    <header class="title-bar">
        <span>Portfolio.xlsx</span>
    </header>

    <div class="formula-bar">
        <span>fx</span>
        <input type="text" readonly id="formula">
    </div>

    <main id="worksheet">

        <div class="grid">

            <!-- Column Headers -->
            <div class="corner"></div>

            <div class="column">A</div>
            <div class="column">B</div>
            <div class="column">C</div>

            <!-- Row Numbers -->

            <div class="row">1</div>
            <div class="cell active" data-value="Welcome">
                Welcome
            </div>

            <div class="cell"></div>
            <div class="cell"></div>

            <div class="row">2</div>

            <div class="cell"
                 data-value="Interactive Portfolio">
                Interactive Portfolio
            </div>

        </div>

    </main>

    <footer class="tabs">

        <button class="sheet active"
                data-sheet="home">
            Home
        </button>

        <button class="sheet"
                data-sheet="projects">
            Projects
        </button>

        <button class="sheet"
                data-sheet="skills">
            Skills
        </button>

        <button class="sheet"
                data-sheet="experience">
            Experience
        </button>

        <button class="sheet"
                data-sheet="contact">
            Contact
        </button>

    </footer>

</div>
</body>
</html>
