<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Ezra's Projects </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="/css/global.css"> -->
    <link rel="stylesheet" href="/css/projects.css">
    <link rel="stylesheet" href="/css/projects-animation.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/ea87ee6546.js" crossorigin="anonymous"></script>
</head>
<body>
<main class="page">
    <nav class="library-nav" aria-label="Main navigation">
        <button class="nav-label" type="button" aria-expanded="false" aria-controls="mobile-nav-drawers">
        <span>
            <span class="nav-label-small">EZRA'S</span>
            <span class="nav-label-title">CATALOG</span>
        </span>
        <span class="catalog-toggle" aria-hidden="true">☰</span>
    </button>
    <div class="nav-drawers" id="mobile-nav-drawers">
        <a href="/index.html" class="nav-card nav-home">
            <span class="nav-icon">⌂</span>
            <span>
                <small>FRONT PAGE</small>
                Home
            </span>
        </a>
        <a href="/about-me/about.html" class="nav-card nav-about">
            <span class="nav-icon">▣</span>
            <span>
                <small>PERSONAL FILE</small>
                About Me
            </span>
        </a>
        <a href="/skills_experience/experience.html" class="nav-card nav-skills">
            <span class="nav-icon">▤</span>
            <span>
                <small>LEDGER</small>
                Skills &amp; Experience
            </span>
        </a>
        <a href="/projects.html"
           class="nav-card nav-projects"
           aria-current="page">
            <span class="nav-icon">▥</span>
            <span>
                <small>CATALOG</small>
                Projects
            </span>
        </a>
    </div>
</nav>


    <header class="page-header">
        <p class="eyebrow">A collection of projects</p>
        <h1>Projects and Works</h1>
        <p class="intro">
            Choose a book below to peruse my research, publications, or projects.
        </p>
    </header>

    <section class="library" aria-label="Project library">
        <div class="shelf-unit">
            <div class="books" id="shelf-one"></div>
            <div class="shelf"></div>
        </div>
    </section>

</main>

<!-- =====================================================
     BOOK VIEWER
====================================================== -->

<div id="book-viewer" class="book-viewer" aria-hidden="true">
    <div id="viewer-backdrop" class="viewer-backdrop"></div>

    <!-- =================================================
         CLOSE
    ================================================== -->

    <button
        id="close-book" class="close-book" type="button" aria-label="Close book"> × </button>


    <!-- =================================================
         BOOK STAGE
    ================================================== -->

    <div class="book-stage">

        <!-- =================================================
             COVER
        ================================================== -->

        <div id="book-cover" class="book-cover" aria-label="Project cover">
            <div class="book-cover-decoration">
                <span class="book-cover-small">COLLECTION</span>
                <span id="cover-title" class="book-cover-title"></span>
                <span class="book-cover-line"></span>
            </div>
        </div>

        <!-- =================================================
             OPEN BOOK
        ================================================== -->

        <div id="open-book-spread" class="open-book-spread" aria-label="Open project book">
            <!-- Left page -->
            <div id="left-page" class="book-page book-page-left"></div>
            <!-- Right page -->
            <div id="right-page" class="book-page book-page-right"></div>
            <!-- Center gutter -->
            <div class="book-gutter" aria-hidden="true"></div>
            <!-- Animated turning sheet -->
            <div id="page-flip-layer" class="page-flip-layer" aria-hidden="true"></div>
        </div>
    </div>

    <!-- =================================================
         NAVIGATION
    ================================================== -->

    <button id="previous-page" class="book-nav previous" type="button" aria-label="Previous page"> ← </button>
    <button id="next-page" class="book-nav next" type="button" aria-label="Next page"> → </button>
</div>

<script src="js/projects-content.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/projects-books.js"></script>
<script>
    const catalog = document.querySelector(".library-nav");
    const catalogButton = catalog.querySelector(".nav-label");

    catalogButton.addEventListener("click", () => {
        const isOpen = catalog.classList.toggle("is-open");

        catalogButton.setAttribute(
            "aria-expanded",
            isOpen
        );

        catalogButton
            .querySelector(".catalog-toggle")
            .textContent = isOpen ? "×" : "☰";
    });
</script>

</body>
</html>
