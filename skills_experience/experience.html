<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio.xlsx</title>
    <link rel="stylesheet" href="css/global.css">

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/ribbon.css">
    <link rel="stylesheet" href="css/spreadsheet.css">
    <link rel="stylesheet" href="css/sheets.css">
    <link rel="stylesheet" href="css/experience-mobile.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/darkmode.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<!-- <div id="loading-screen">
    <div class="excel-loader">
        <h1>Portfolio.xlsx</h1>
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
        <p>Opening workbook...</p>
    </div>
</div> -->

<div class="excel-window">

    <!-- ===================================== -->
    <!-- TITLE BAR -->
    <!-- ===================================== -->

    <header class="title-bar">

        <div class="window-left">

            <button class="quick-btn">
                <i class="fa-solid fa-floppy-disk"></i>
            </button>

            <button class="quick-btn">
                <i class="fa-solid fa-arrow-rotate-left"></i>
            </button>

            <button class="quick-btn">
                <i class="fa-solid fa-arrow-rotate-right"></i>
            </button>

        </div>

        <div class="window-title">
            Portfolio.xlsx
        </div>

        <!-- <div class="window-right">
            <button id="theme-toggle">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div> -->

    </header>

    <!-- ===================================== -->
    <!-- RIBBON -->
    <!-- ===================================== -->

    <nav class="ribbon">

        <div class="ribbon-tabs">

            <button class="ribbon-tab active">
                <a href="/index.html">Home</a>
            </button>

            <button class="ribbon-tab">
                <a href="/projects/projects.html">Projects</a>
            </button>
            <button class="ribbon-tab">
                <a href="/publications/publications.html">Publications</a>
            </button>
            <button class="ribbon-tab">
                <a href="https://github.com/ewingard">Github</a>
            </button>
            <button class="ribbon-tab">
                <a href="/about-me/about.html">About Me</a>
            </button>

        </div>

        <div class="ribbon-toolbar">
            <div class="tool-group">
                <button>
                    <i class="fa-solid fa-copy"></i>
                </button>
                <button>
                    <i class="fa-solid fa-paste"></i>
                </button>
            </div>

            <div class="tool-group">
                <button
                id="filter-button"
                title="Filter"
                type="button">
                    <i class="fa-solid fa-filter"></i>
                </button>
                <button
                id="sort-button"
                title="Sort"
                type="button">
                    <i class="fa-solid fa-arrow-down-wide-short"></i>
                </button>

            </div>

            <div class="tool-group">

                <button id="search-btn">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>

            </div>

        </div>

    </nav>

    <!-- ===================================== -->
    <!-- FORMULA BAR -->
    <!-- ===================================== -->

    <section class="formula-container">

        <div class="name-box">

            A1

        </div>

        <button class="formula-btn">

            <i class="fa-solid fa-xmark"></i>

        </button>

        <button class="formula-btn">

            <i class="fa-solid fa-check"></i>

        </button>

        <div class="fx">

            fx

        </div>
        <input
            type="Text"
            id="formula-bar"
            readonly>
    </section>

    <!-- ===================================== -->
    <!-- WORKBOOK -->
    <!-- ===================================== -->

    <main class="workbook">
    <div class="spreadsheet-viewport">
        <section class="spreadsheet" id="spreadsheet"></section>
    </div>
    <div class="mobile-sheet-container"></div>
    </main>


    <!-- ===================================== -->
    <!-- WORKSHEET TABS -->
    <!-- ===================================== -->

    <footer class="sheet-tabs-container">

        <div class="sheet-tabs"></div>

    </footer>
    </div>
    <script src="js/workbook.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/formulaBar.js"></script>
    <script src="js/search.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
